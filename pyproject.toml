[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:homeassistant"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Catch syntax errors, undefined names, and unused imports before committing.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F401", "F63", "F7", "F82"]
